[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonink"
version = "0.0.1"
description = "Offline safety checks for MCP servers: poisoned tool descriptions (Japanese + English), broad permissions, risky client configs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lemonink = "lemonink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
