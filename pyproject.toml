[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonink"
dynamic = ["version"]
description = "Offline safety checks for MCP servers: poisoned tool descriptions (Japanese + English), broad permissions, risky client configs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Ryoya Kubo" }]
keywords = ["mcp", "model-context-protocol", "security", "prompt-injection", "tool-poisoning", "llm", "japanese", "scanner"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ryoyakubo-ai/lemonink"
Source = "https://github.com/ryoyakubo-ai/lemonink"
Issues = "https://github.com/ryoyakubo-ai/lemonink/issues"
Changelog = "https://github.com/ryoyakubo-ai/lemonink/blob/main/CHANGELOG.md"

[project.scripts]
lemonink = "lemonink.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lemonink.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
